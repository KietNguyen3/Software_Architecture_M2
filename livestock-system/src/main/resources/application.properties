spring.application.name=vinabeef-gate-subsystem

# Shared operational database (PostgreSQL in production; in-memory H2 for the demo)
spring.datasource.url=jdbc:h2:mem:vinabeef;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Gate Reader Node: how often the store-and-forward relay drains the local queue when the WAN link is up.
vinabeef.edge.forward-interval-ms=500
